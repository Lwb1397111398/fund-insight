services:
  - type: web
    name: fund-insight
    runtime: python
    buildCommand: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      . $HOME/.cargo/env
      export CARGO_HOME=/tmp/cargo
      export RUSTUP_HOME=/tmp/rustup
      pip install -r requirements.txt
    startCommand: python scripts/run_migrations.py && uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: CARGO_HOME
        value: "/tmp/cargo"
      - key: RUSTUP_HOME
        value: "/tmp/rustup"
      - key: CRAWLER_ENABLED
        value: "true"
      # 常驻调度器（第 98 批，2026-10-15 老板改口「我要求基金也自动更新」⇒ 推翻
      # 2026-09-29「不加定时任务」的生产决定）。作用见 src/tasks/scheduler.py：
      # 实例每次唤醒/部署起手先追赶「基金更新 → 验证」（当天跑过就零发包，
      # 执行日持久化在 system_config），10:00/15:30 北京时间窗口实例醒着时照跑。
      # 02:00 清理是 no-op（HARD_DELETE_DISABLED），11:00 观点汇总仍被
      # VIEWPOINT_AUTO_SUMMARY_ENABLED 默认关挡住，不会多删数据或多打接口。
      # ⚠ 这一行只是"重新创建服务时的意图声明"：实测仪表盘不跟蓝图同步 envVars
      # （PYTHON_VERSION 先例 + 本行部署后 app_env 仍报 development），真正兑现生产
      # 自动更新的是 `src/core/config.py` 里 SCHEDULER_ENABLED 的**缺省值 true**。
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "120"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: ACCESS_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://fund-insight.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: VOLCENGINE_API_KEY
        sync: false
      - key: VOLCENGINE_BASE_URL
        value: "https://ark.cn-beijing.volces.com/api/v3"
      # 模型与渠道选择由 Render 网页环境变量管理（不在蓝图写死，避免部署时覆盖线上配置）
      - key: VOLCENGINE_MODEL
        sync: false
      - key: VOLCENGINE_LIGHT_MODEL
        sync: false
      # 主动/辅助双渠道（均为 OpenAI 兼容）由仪表盘管理：LLM_PROVIDER 填 custom 即走 LLM_*；
      # LLM_SECONDARY_* 四项全配才启用辅助渠道，缺省留空＝不启用
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_LIGHT_MODEL
        sync: false
      - key: LLM_SECONDARY_API_KEY
        sync: false
      - key: LLM_SECONDARY_BASE_URL
        sync: false
      - key: LLM_SECONDARY_MODEL
        sync: false
      - key: LLM_SECONDARY_LIGHT_MODEL
        sync: false
      # L1：正式加权默认关；shadow 双跑默认开（只记 log，服务 legacy）
      - key: ADVICE_L1_HIT_WEIGHTING
        value: "0"
      - key: ADVICE_L1_SHADOW
        value: "1"
      - key: L1_SHADOW_STARTED_AT
        value: "2026-07-29"
      - key: L1_SHADOW_BASELINE_VERIFIED
        value: "220"
      - key: L1_SHADOW_REEVAL_NEW
        value: "150"
      - key: L1_SHADOW_REEVAL_WEEKS
        value: "6"

  - type: cron
    name: fund-insight-scheduler
    runtime: python
    schedule: "30 10 * * *"
    buildCommand: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      . $HOME/.cargo/env
      export CARGO_HOME=/tmp/cargo
      export RUSTUP_HOME=/tmp/rustup
      pip install -r requirements.txt
    startCommand: python scripts/run_scheduled_tasks.py daily
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "120"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: VOLCENGINE_API_KEY
        sync: false
      - key: VOLCENGINE_BASE_URL
        value: "https://ark.cn-beijing.volces.com/api/v3"
      # 模型与渠道选择由 Render 网页环境变量管理（不在蓝图写死，避免部署时覆盖线上配置）
      - key: VOLCENGINE_MODEL
        sync: false
      - key: VOLCENGINE_LIGHT_MODEL
        sync: false
      # 主动/辅助双渠道（与 Web 服务同一套变量，Cron 跑分析/验证同样要能连 LLM）
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_LIGHT_MODEL
        sync: false
      - key: LLM_SECONDARY_API_KEY
        sync: false
      - key: LLM_SECONDARY_BASE_URL
        sync: false
      - key: LLM_SECONDARY_MODEL
        sync: false
      - key: LLM_SECONDARY_LIGHT_MODEL
        sync: false

  # 每周一 11:30 UTC ≈ 北京时间 19:30：三桶保留（cap 500 + verified 护栏 + 摘要归档）
  - type: cron
    name: fund-insight-weekly-retention
    runtime: python
    schedule: "30 11 * * 1"
    buildCommand: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      . $HOME/.cargo/env
      export CARGO_HOME=/tmp/cargo
      export RUSTUP_HOME=/tmp/rustup
      pip install -r requirements.txt
    startCommand: python scripts/run_scheduled_tasks.py weekly-retention
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "120"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_THREE_BUCKET_RETENTION
        value: "true"
      - key: THREE_BUCKET_MAX_ROUNDS
        value: "5"

databases:
  - name: fund-insight-db
    plan: free
