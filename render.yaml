services:
  - type: web
    name: fund-insight
    runtime: python
    buildCommand: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      . $HOME/.cargo/env
      export CARGO_HOME=/tmp/cargo
      export RUSTUP_HOME=/tmp/rustup
      pip install -r requirements.txt
    startCommand: python scripts/run_migrations.py && uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: CARGO_HOME
        value: "/tmp/cargo"
      - key: RUSTUP_HOME
        value: "/tmp/rustup"
      - key: CRAWLER_ENABLED
        value: "true"
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "120"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: ACCESS_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://fund-insight.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: volcengine
      - key: VOLCENGINE_API_KEY
        sync: false
      - key: VOLCENGINE_BASE_URL
        value: "https://ark.cn-beijing.volces.com/api/v3"
      - key: VOLCENGINE_MODEL
        value: "ep-20260424143452-nhsrm"
      - key: VOLCENGINE_LIGHT_MODEL
        value: "ep-20260424143452-nhsrm"
      # L1：正式加权默认关；shadow 双跑默认开（只记 log，服务 legacy）
      - key: ADVICE_L1_HIT_WEIGHTING
        value: "0"
      - key: ADVICE_L1_SHADOW
        value: "1"
      - key: L1_SHADOW_STARTED_AT
        value: "2026-07-29"
      - key: L1_SHADOW_BASELINE_VERIFIED
        value: "220"
      - key: L1_SHADOW_REEVAL_NEW
        value: "150"
      - key: L1_SHADOW_REEVAL_WEEKS
        value: "6"

  - type: cron
    name: fund-insight-scheduler
    runtime: python
    schedule: "30 10 * * *"
    buildCommand: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      . $HOME/.cargo/env
      export CARGO_HOME=/tmp/cargo
      export RUSTUP_HOME=/tmp/rustup
      pip install -r requirements.txt
    startCommand: python scripts/run_scheduled_tasks.py daily
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "120"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: volcengine
      - key: VOLCENGINE_API_KEY
        sync: false
      - key: VOLCENGINE_BASE_URL
        value: "https://ark.cn-beijing.volces.com/api/v3"
      - key: VOLCENGINE_MODEL
        value: "ep-20260424143452-nhsrm"
      - key: VOLCENGINE_LIGHT_MODEL
        value: "ep-20260424143452-nhsrm"

  # 每周一 11:30 UTC ≈ 北京时间 19:30：三桶保留（cap 500 + verified 护栏 + 摘要归档）
  - type: cron
    name: fund-insight-weekly-retention
    runtime: python
    schedule: "30 11 * * 1"
    buildCommand: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      . $HOME/.cargo/env
      export CARGO_HOME=/tmp/cargo
      export RUSTUP_HOME=/tmp/rustup
      pip install -r requirements.txt
    startCommand: python scripts/run_scheduled_tasks.py weekly-retention
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: APP_ENV
        value: production
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "120"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_THREE_BUCKET_RETENTION
        value: "true"
      - key: THREE_BUCKET_MAX_ROUNDS
        value: "5"

databases:
  - name: fund-insight-db
    plan: free
